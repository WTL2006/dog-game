<!DOCTYPE html>
<html>
  <style>
    body{
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;      
      justify-content: center; 
      
      background-image: url("start_image.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      
    }
    
    .top_title h1 {
      text-align: center;
      font-size: 50px;
      font-weight: bold;
      -webkit-text-stroke: 0.5px white;
      paint-order: stroke fill
      color: #000000;
    }

    .start_but{
      display: block;
      margin: 0 auto;
    }
    
    .start_but button{
      font-size: 24px;
      padding: 20px 40px;
      border: 4px solid #555555;
    }

    .description p{
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      -webkit-text-stroke: 0.2px white;
      paint-order: stroke fill
      color: #000000;
    }

    .lan_but{
      display: block;
      margin: 0 auto;
    }

    .lan_but button{
      font-size: 24px;
      padding: 20px 40px;
      border: 4px solid #555555;
    }
    
  </style>
  <body>
    <div class="top_title">
      <h1>HUMANS AND DOGS</h1>
    </div>

    <div class="description">
      <p>
        Press the Start Button to Start the Game !
        <br>
        Learn More about Dogs !
      </p>
    </div>

    <div class="start_but">
      <a href="mode_selection.html">
        <button>Start Game</button>
      </a>
    </div>

    <div>
      <br>
    </div>

    <div class="lan_but">
      <a href="index_cn.html">
        <button>中文版</button>
      </a>
    </div>
  </body>
  

  
  
</html>
