<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HUMANS AND DOGS - Mode 1: Canine Safety Quiz</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      user-select: none;
    }
    .tablet-screen {
      width: 960px;
      height: 550px;
      max-width: 98vw;
      max-height: 96vh;
      box-shadow: 0 20px 40px -10px rgba(15, 23, 42, 0.4), 0 0 0 8px #1e293b, 0 0 0 12px #0f172a;
      display: grid;
      grid-template-rows: 52px 1fr 58px;
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(34, 197, 94, 0); }
      100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
    }
    .selected-card {
      border-color: #22c55e !important;
      background-color: #f0fdf4 !important;
      animation: pulse-ring 1.8s infinite;
    }
    .pointer-notch::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px;
      border-style: solid;
      border-color: #f97316 transparent transparent transparent;
    }
    .circle-timer {
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      transition: stroke-dashoffset 1s linear, stroke 0.3s;
    }
    @keyframes heart-break {
      0% { transform: scale(1); }
      50% { transform: scale(1.3) rotate(-15deg); filter: drop-shadow(0 0 6px red); }
      100% { transform: scale(0.9); opacity: 0.25; filter: grayscale(1); }
    }
    .heart-lost {
      animation: heart-break 0.6s forwards;
    }
  </style>
</head>

  <script>
    // --- Audio Synthesis Engine (Web Audio API) ---
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.ctx = new AudioContext();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      toggleMute() {
        this.muted = !this.muted;
        return this.muted;
      }
      playClick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playCorrect() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + i * 0.08);
          gain.gain.setValueAtTime(0.2, now + i * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.25);
        });
      }
      playWrong() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        [220, 164.81].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now + i * 0.14);
          gain.gain.setValueAtTime(0.2, now + i * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.01, now + i * 0.14 + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.14);
          osc.stop(now + i * 0.14 + 0.25);
        });
      }
    }
    const sfx = new SoundFX();

    // --- Dog Encounters Question Bank ---
    const rawQuestions = [
      {
        id: 1,
        category: "Stray or Off-Leash Dog",
        prompt: "An unfamiliar dog without a leash suddenly runs toward you barking loudly. What should you do?",

            <path d="M0 150 Q120 140 250 150 T500 150 L500 200 L0 200 Z" fill="#86efac"/>

            <path d="M300 130 Q320 100 350 115 L380 105 L370 125 Q400 135 410 160 L395 160 L385 140 L350 140 L345 160 L330 160 Z" fill="#78350f"/>

            <line x1="175" y1="138" x2="175" y2="165" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
            <line x1="185" y1="138" x2="185" y2="165" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
          </svg>
        `,
        options: [
          {
            title: "Be a Tree",
            desc: "Stop, fold arms across chest, avoid eye contact.",
            icon: "🌲",
            isCorrect: true,
            feedback: "Correct! Running triggers chase instinct. Standing motionless ('like a tree') makes you uninteresting and defuses the charge."

          {
            title: "Scream & Sprint",
            desc: "Turn around and run as fast as possible yelling.",
            icon: "🏃‍♂️",
            isCorrect: false,
            feedback: "Dangerous! Running activates the dog's pursuit drive, and high-pitched screaming agitates the dog into biting."

          {
            title: "Wave Arms & Shout",
            desc: "Wave hands in the air and shout aggressively.",
            icon: "🗣️",
            isCorrect: false,

      },
      {
        id: 2,
        category: "Food & Chewing",
        prompt: "You see a dog lying down gnawing on a juicy bone or food bowl. What should you do?",
        sceneSvg: `
          <svg class="w-full h-full" viewBox="0 0 500 200" fill="none">
            <rect width="500" height="200" fill="#fef3c7"/>
            <rect y="160" width="500" height="40" fill="#cbd5e1"/>
            <ellipse cx="210" cy="165" rx="30" ry="12" fill="#ef4444"/>
            <rect x="195" y="152" width="30" height="8" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
            <path d="M260 160 Q280 120 330 130 L350 165 Z" fill="#b45309"/>
            <circle cx="245" cy="145" r="20" fill="#b45309"/>
            <text x="290" y="90" font-size="28" font-family="sans-serif">🍖💤</text>
          </svg>
        `,
        options: [
          {

            desc: "Stay back and let the dog eat without interruption.",
            icon: "🛡️",
            isCorrect: true,
            feedback: "Correct! Resource guarding is a primary cause of dog bites. Never disturb an eating dog."
          },
          {

            isCorrect: false,
            feedback: "Very Dangerous! Dogs will naturally defend food or bones. Reaching in almost guarantees a warning bite."
          },
          {

            icon: "🤫",
            isCorrect: false,
            feedback: "Unsafe! Touching an eating dog startles it, triggering a defensive reflex snap."

        ]
      },
      {
        id: 3,
        category: "Meeting Pets with Owners",
        prompt: "A neighbor is walking a cute dog on a leash. You really want to pet it. What is the first step?",
        sceneSvg: `
          <svg class="w-full h-full" viewBox="0 0 500 200" fill="none">
            <rect width="500" height="200" fill="#f0fdf4"/>
            <rect y="155" width="500" height="45" fill="#e2e8f0"/>

        options: [
          {
            title: "Ask the Owner",
            desc: "Ask politely first: 'May I pet your dog?'",

            isCorrect: true,
            feedback: "Correct! The owner knows best whether their dog is friendly, nervous, injured, or in training."

          {

            desc: "Run over enthusiastically and wrap arms around it.",
            icon: "🤗",
            isCorrect: false,
            feedback: "Dangerous! Hugging restricts a dog's movement, which dogs perceive as trapping or threatening."
          },
          {
            title: "Pat Head Suddenly",
            desc: "Reach directly over the dog's eyes to pat its head.",
            icon: "✋",
            isCorrect: false,
            feedback: "Unsafe! Reaching from high above a dog's head is intimidating. Dogs prefer sniffing first, then chest strokes."

      },
      {
        id: 4,
        category: "Cornered or Anxious Dog",
        prompt: "A dog is cornered against a fence in an alley, stiff, growling with teeth showing. What should you do?",
        sceneSvg: `

    // --- State Management ---
    let questions = [];
    let currentIndex = 0;
    let selectedOptionIndex = null;
    let score = 0;
    let lives = 3;
    let timer = 15;
    let timerInterval = null;
    const totalQuestionsCount = 10;

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function initGame() {
      questions = shuffleArray(rawQuestions).slice(0, totalQuestionsCount);
      questions.forEach(q => {
        q.options = shuffleArray(q.options);
      });

      currentIndex = 0;
      score = 0;
      lives = 3;
      selectedOptionIndex = null;

      for (let i = 1; i <= 3; i++) {
        const h = document.getElementById(`heart-${i}`);
        if (h) h.classList.remove('heart-lost');
      }

      updateScoreUI();
      updateLivesUI();
      buildProgressTrack();
      loadQuestion(currentIndex);
    }

    function buildProgressTrack() {
      const container = document.getElementById('progressTrack');
      container.innerHTML = `
        <div class="absolute left-3 right-3 top-1/2 -translate-y-1/2 h-1 bg-slate-200 -z-0"></div>
        <div id="progressFill" class="absolute left-3 top-1/2 -translate-y-1/2 h-1 bg-amber-400 -z-0 transition-all duration-300" style="width: 0%;"></div>
      `;

      questions.forEach((_, idx) => {
        const node = document.createElement('div');
        node.id = `track-node-${idx}`;
        node.className = `relative z-10 w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs transition-all duration-300 ${
          idx === 0 
            ? 'bg-amber-500 text-white shadow border border-amber-600 scale-110 pointer-notch' 
            : 'bg-white text-slate-400 border border-slate-300'
        }`;
        node.textContent = '?';
        container.appendChild(node);
      });
      updateProgressFill();
    }

    function updateProgressFill() {
      const fill = document.getElementById('progressFill');
      if (fill) {
        const pct = (currentIndex / (totalQuestionsCount - 1)) * 100;
        fill.style.width = `${pct}%`;
      }
    }

    function loadQuestion(index) {
      if (index >= questions.length || lives <= 0) {
        showEndGame();
        return;
      }

      selectedOptionIndex = null;
      document.getElementById('actionBtn').disabled = true;

      const q = questions[index];
      document.getElementById('questionTag').textContent = `Question ${index + 1}/${questions.length}`;
      document.getElementById('scenarioCategory').textContent = q.category;
      document.getElementById('questionPrompt').textContent = q.prompt;
      document.getElementById('scenarioVisual').innerHTML = q.sceneSvg;

      questions.forEach((_, i) => {
        const node = document.getElementById(`track-node-${i}`);
        if (!node) return;
        node.classList.remove('pointer-notch', 'scale-110');
        if (i === index) {
          node.className = 'relative z-10 w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs transition-all duration-300 bg-amber-500 text-white shadow border border-amber-600 scale-110 pointer-notch';
          node.textContent = '?';
        } else if (i < index) {
          // preserve check or cross
        } else {
          node.className = 'relative z-10 w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs transition-all duration-300 bg-white text-slate-400 border border-slate-300';
          node.textContent = '?';
        }
      });
      updateProgressFill();

      const optionsContainer = document.getElementById('optionsGrid');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, optIdx) => {
        const card = document.createElement('button');
        // Locked 155px height card with overflow hidden
        card.className = 'option-card h-[155px] text-left bg-white rounded-2xl p-3 border-2 border-slate-200 hover:border-slate-300 hover:shadow transition-all flex flex-col items-center justify-center cursor-pointer group active:scale-[0.98] w-full overflow-hidden';
        card.setAttribute('data-index', optIdx);

        card.innerHTML = `
          <div class="text-3xl mb-1.5 group-hover:scale-110 transition-transform flex-shrink-0">${opt.icon}</div>
          <div class="text-center w-full overflow-hidden">
            <h4 class="font-extrabold text-slate-800 text-xs sm:text-sm leading-tight truncate">${opt.title}</h4>
            <p class="text-[11px] text-slate-500 mt-1 line-clamp-2 leading-tight">${opt.desc}</p>
          </div>
        `;

        card.addEventListener('click', () => {
          sfx.playClick();
          selectOption(optIdx);
        });

        card.addEventListener('dblclick', () => {
          selectOption(optIdx);
          submitAnswer();
        });

        optionsContainer.appendChild(card);
      });

      startTimer();
    }

    function selectOption(optIdx) {
      selectedOptionIndex = optIdx;
      document.getElementById('actionBtn').disabled = false;

      const cards = document.querySelectorAll('.option-card');
      cards.forEach((card, idx) => {
        if (idx === optIdx) {
          card.classList.add('selected-card');
        } else {
          card.classList.remove('selected-card');
        }
      });
    }

    function startTimer() {
      clearInterval(timerInterval);
      timer = 15;
      updateTimerUI(timer);

      timerInterval = setInterval(() => {
        timer--;
        updateTimerUI(timer);

        if (timer <= 0) {
          clearInterval(timerInterval);
          handleTimeout();
        }
      }, 1000);
    }

    function updateTimerUI(seconds) {
      const timerText = document.getElementById('timerText');
      const timerCircle = document.getElementById('timerCircle');
      if (timerText) timerText.textContent = `${seconds}s`;

      const totalOffset = 251.2;
      const progress = seconds / 15;
      const offset = totalOffset - (progress * totalOffset);
      if (timerCircle) {
        timerCircle.style.strokeDashoffset = offset;
        if (seconds <= 4) {
          timerCircle.setAttribute('stroke', '#ef4444');
        } else {
          timerCircle.setAttribute('stroke', '#f97316');
        }
      }
    }

    function submitAnswer() {
      if (selectedOptionIndex === null) return;
      clearInterval(timerInterval);

      const q = questions[currentIndex];
      const selected = q.options[selectedOptionIndex];

      if (selected.isCorrect) {
        sfx.playCorrect();
        score += 100 + Math.max(0, timer * 5);
        updateScoreUI();
        markTrackNode(currentIndex, true);
        showFeedback(true, "Safe Decision!", selected.feedback);
      } else {
        sfx.playWrong();
        deductLife();
        markTrackNode(currentIndex, false);
        showFeedback(false, "Unsafe Action!", selected.feedback);
      }
    }

    function handleTimeout() {
      sfx.playWrong();
      deductLife();
      markTrackNode(currentIndex, false);
      showFeedback(false, "Time Out!", "Hesitating too long or freezing under panic can escalate unpredictable dog encounters. Always stay calm and remember your safe cues.");
    }

    function deductLife() {
      if (lives > 0) {
        const heartElem = document.getElementById(`heart-${lives}`);
        if (heartElem) {
          heartElem.classList.add('heart-lost');
        }
        lives--;
      }
      updateLivesUI();
    }

    function updateLivesUI() {
      const text = document.getElementById('livesText');
      if (text) {
        text.textContent = `${lives} Left`;
        if (lives === 1) {
          text.className = 'text-[11px] font-bold text-rose-600 animate-pulse mt-1';
        } else {
          text.className = 'text-[11px] font-semibold text-slate-500 mt-1';
        }
      }
    }

    function updateScoreUI() {
      const scoreElem = document.getElementById('scoreDisplay');
      if (scoreElem) scoreElem.textContent = score;

      const stars = document.getElementById('starContainer');
      if (stars) {
        let starCount = 1;
        if (score >= 900) starCount = 4;
        else if (score >= 600) starCount = 3;
        else if (score >= 300) starCount = 2;

        stars.innerHTML = '';
        for (let i = 1; i <= 4; i++) {
          const s = document.createElement('span');
          s.className = `text-sm font-bold ${i <= starCount ? 'text-amber-400' : 'text-slate-200'}`;
          s.textContent = '★';
          stars.appendChild(s);
        }
      }
    }

    function markTrackNode(index, isCorrect) {
      const node = document.getElementById(`track-node-${index}`);
      if (node) {
        node.classList.remove('bg-amber-500', 'border-amber-600', 'pointer-notch', 'scale-110');
        if (isCorrect) {
          node.className = 'relative z-10 w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs bg-emerald-500 text-white border border-emerald-600';
          node.textContent = '✓';
        } else {
          node.className = 'relative z-10 w-6 h-6 rounded-md flex items-center justify-center font-bold text-xs bg-rose-500 text-white border border-rose-600';
          node.textContent = '✗';
        }
      }
    }

    function showFeedback(isSafe, title, msg) {
      const modal = document.getElementById('feedbackModal');
      const card = document.getElementById('feedbackCard');
      const icon = document.getElementById('feedbackIcon');
      const titleElem = document.getElementById('feedbackTitle');
      const textElem = document.getElementById('feedbackText');

      if (isSafe) {
        card.className = 'bg-white rounded-3xl max-w-md w-full p-6 text-center border-4 border-emerald-400 shadow-2xl';
        icon.className = 'w-14 h-14 rounded-full mx-auto flex items-center justify-center text-3xl mb-2.5 bg-emerald-100 text-emerald-600';
        icon.textContent = '🛡️';
        titleElem.className = 'text-xl font-extrabold text-emerald-700 mb-1';
      } else {
        card.className = 'bg-white rounded-3xl max-w-md w-full p-6 text-center border-4 border-rose-400 shadow-2xl';
        icon.className = 'w-14 h-14 rounded-full mx-auto flex items-center justify-center text-3xl mb-2.5 bg-rose-100 text-rose-600';
        icon.textContent = '⚠️';
        titleElem.className = 'text-xl font-extrabold text-rose-700 mb-1';
      }

      titleElem.textContent = title;
      textElem.textContent = msg;
      modal.classList.remove('hidden');
    }

    function nextQuestion() {
      document.getElementById('feedbackModal').classList.add('hidden');
      if (lives <= 0) {
        showEndGame();
        return;
      }
      currentIndex++;
      if (currentIndex >= questions.length) {
        showEndGame();
      } else {
        loadQuestion(currentIndex);
      }
    }

    function skipQuestion() {
      sfx.playClick();
      clearInterval(timerInterval);
      markTrackNode(currentIndex, false);
      currentIndex++;
      if (currentIndex >= questions.length) {
        showEndGame();
      } else {
        loadQuestion(currentIndex);
      }
    }

    function showEndGame() {
      clearInterval(timerInterval);
      const modal = document.getElementById('endGameModal');
      const title = document.getElementById('endGameTitle');
      const subtitle = document.getElementById('endGameSubtitle');
      const scoreElem = document.getElementById('endGameScore');
      const icon = document.getElementById('endGameIcon');
      const starsElem = document.getElementById('endGameStars');

      scoreElem.textContent = score;

      if (lives <= 0) {
        icon.textContent = '💔';
        title.textContent = 'Out of Lives!';
        subtitle.textContent = 'You lost all 3 hearts. Review canine body language and safe habits to try again!';
        starsElem.textContent = '★☆☆☆';
      } else {
        icon.textContent = '🏆';
        title.textContent = 'Quiz Completed!';
        subtitle.textContent = 'Congratulations! You demonstrated excellent knowledge of dog safety!';
        let starStr = '★★★★';
        if (score < 400) starStr = '★★☆☆';
        else if (score < 800) starStr = '★★★☆';
        starsElem.textContent = starStr;
      }

      modal.classList.remove('hidden');
    }

    document.getElementById('actionBtn').addEventListener('click', () => {
      sfx.playClick();
      submitAnswer();

    document.getElementById('modalNextBtn').addEventListener('click', () => {
      sfx.playClick();
      nextQuestion();

    document.getElementById('skipBtn').addEventListener('click', skipQuestion);

    document.getElementById('playAgainBtn').addEventListener('click', () => {
      sfx.playClick();
      document.getElementById('endGameModal').classList.add('hidden');
      initGame();

        topIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/><path stroke-linecap="round" stroke-linejoin="round" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>`;
        if (sideIcon) sideIcon.textContent = '🔇';
        if (sideText) sideText.textContent = 'Sound Off';
      } else {
        topIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>`;
        if (sideIcon) sideIcon.textContent = '🔊';
        if (sideText) sideText.textContent = 'Sound On';
        sfx.playClick();
      }
    }

    document.getElementById('topMuteBtn').addEventListener('click', handleMuteToggle);
    document.getElementById('sideMuteBtn').addEventListener('click', handleMuteToggle);

    window.addEventListener('DOMContentLoaded', initGame);
  </script>
